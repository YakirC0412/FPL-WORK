<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gameweek Data V2 — Mobile Check</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#070a10;color:#f6f8fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:radial-gradient(circle at 50% 0%,rgba(210,179,84,.13),transparent 36rem),#070a10}.bar{width:min(900px,100%);margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}.bar h1{margin:0;font-size:17px}.bar p{margin:4px 0 0;color:#8e99aa;font-size:11px}.sizes{display:flex;gap:6px}.sizes button{height:34px;padding:0 10px;border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#f6f8fb;background:#111824;font:700 11px inherit;cursor:pointer}.sizes button.active{color:#07101d;border-color:transparent;background:#d2b354}.device{width:390px;height:844px;margin:auto;overflow:hidden;border:8px solid #1a2230;border-radius:28px;background:#070a10;box-shadow:0 28px 90px rgba(0,0,0,.62)}iframe{width:100%;height:100%;border:0;background:#070a10}@media(max-width:520px){body{padding:0}.bar{display:none}.device{width:100vw;height:100vh;border:0;border-radius:0}}
  </style>
</head>
<body>
  <header class="bar"><div><h1>Gameweek Data V2 · Mobile check</h1><p>The app runs inside the selected mobile viewport.</p></div><div class="sizes"><button type="button" data-width="390" class="active">390px</button><button type="button" data-width="430">430px</button></div></header>
  <main class="device" id="device"><iframe src="../app/gameweek-data-v2.html?v=mobile-check" title="Gameweek Data V2 mobile preview"></iframe></main>
  <script>
    const device=document.getElementById("device");
    document.querySelectorAll("[data-width]").forEach(button=>button.addEventListener("click",()=>{device.style.width=`${button.dataset.width}px`;document.querySelectorAll("[data-width]").forEach(item=>item.classList.toggle("active",item===button))}));
  </script>
</body>
</html>
